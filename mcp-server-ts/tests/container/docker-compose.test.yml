services:
  python-api:
    image: psyb0t/stealthy-auto-browse:latest
    ports: ["8080:8080"]
    environment:
      - AUTH_TOKEN=test-token
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  ts-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile.ts
    ports: ["8081:8081"]
    environment:
      - PYTHON_API_URL=http://python-api:8080
      - AUTH_TOKEN=test-token
      - PORT=8081
    depends_on:
      python-api:
        condition: service_healthy

  test-runner:
    build:
      context: ../..
      dockerfile: tests/container/Dockerfile.test_runner
    depends_on:
      - ts-mcp
    environment:
      - TS_MCP_URL=http://ts-mcp:8081/mcp/ts
      - PYTHON_API_URL=http://python-api:8080
      - AUTH_TOKEN=test-token
